name: terraform-apply

# Applies on merge to main (or manual dispatch). State lives in S3, so this job
# writes nothing back to the repo — no branch-push bypass is needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # OIDC federation to AWS for the S3 backend

concurrency:
  group: tf-apply-main   # never run two applies at once
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # The org is not a secret, so it lives here rather than in an Actions secret:
  # retargeting the demo is then one reviewed diff that switches config, org and
  # state key together on merge. syslog-9001 is a child of kenneth-testing.
  TF_VAR_monad_organization_id: f01458bb-f43d-4e57-aaed-7c808e235fb3
  # Actions secrets (GitHub has no description field, so each is described here
  # and in the README's Setup table):
  #
  # MONAD_SYSLOG_API_TOKEN: Monad API key Terraform authenticates with. An org
  # key minted in syslog-9001 that can create, update and delete its components.
  TF_VAR_monad_api_token: ${{ secrets.MONAD_SYSLOG_API_TOKEN }}
  # MONAD_SYSLOG_HTTP_INPUT_API_KEY: value of the Monad secret
  # syslog-demo-http-input-api-key (secrets.tf). An org API key for syslog-9001
  # with pipeline:data:write, sent as x-api-key from the intake pipeline to the
  # per-type pipelines. Change it here and apply to rotate it.
  TF_VAR_http_input_api_key: ${{ secrets.MONAD_SYSLOG_HTTP_INPUT_API_KEY }}
  #
  # TF_STATE_BUCKET: S3 bucket holding Terraform state (used at init below).
  # AWS_ROLE_ARN: IAM role CI assumes through GitHub OIDC to read and write that
  # bucket (bootstrap/github-oidc-role.cfn.yaml).
  # One state file per target org. The previous org's state stays at
  # gitops-terraform-demo/terraform.tfstate, untouched.
  TF_STATE_KEY: gitops-terraform-demo/syslog-9001/terraform.tfstate

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (S3 backend)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # Pinned, not `latest`. An unpinned CLI means the plan a reviewer reads and
      # the apply that follows can run on different Terraform versions, and a
      # release lands in CI with no commit to point at. Bump deliberately, and
      # keep it in step with plan.yml. Must satisfy versions.tf (>= 1.11).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=us-west-1"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -lock-timeout=120s
