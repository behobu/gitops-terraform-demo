name: terraform-plan

# Read-only plan. Runs on every PR (posted as a PR comment) and on demand from
# the Actions tab ("Run workflow"), e.g. to check for drift. Never applies.
#
# Manual runs: pick `main`. The AWS role that guards the state bucket trusts
# only `main` and pull requests (bootstrap/trust-policy.json), so a manual run
# on any other branch fails at "Configure AWS credentials".

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # post the plan comment
  id-token: write        # OIDC federation to AWS for the S3 backend

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # The org is not a secret, so it lives here rather than in an Actions secret:
  # retargeting the demo is then one reviewed diff that switches config, org and
  # state key together on merge. syslog-9001 is a child of kenneth-testing.
  TF_VAR_monad_organization_id: f01458bb-f43d-4e57-aaed-7c808e235fb3
  # An API key that can reach that org (never committed). A new secret name, not
  # MONAD_API_TOKEN: that one is scoped to the previous (Terraform team) org.
  TF_VAR_monad_api_token: ${{ secrets.MONAD_SYSLOG_API_TOKEN }}
  # One state file per target org. The previous org's state stays at
  # gitops-terraform-demo/terraform.tfstate, untouched.
  TF_STATE_KEY: gitops-terraform-demo/syslog-9001/terraform.tfstate

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (S3 backend)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # Pinned, not `latest`. An unpinned CLI means the plan a reviewer reads and
      # the apply that follows can run on different Terraform versions, and a
      # release lands in CI with no commit to point at. Bump deliberately, and
      # keep it in step with apply.yml. Must satisfy versions.tf (>= 1.11).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=us-west-1"

      - name: Terraform plan
        id: plan
        # `shell: bash` is load-bearing, not decoration. The default shell is
        # `bash -e {0}`, which does NOT set pipefail, so `terraform plan | tee`
        # exits with tee's status and a FAILING plan reports success. This repo's
        # whole premise is that the plan on a PR is the gate, so a green check
        # that survives a failed plan is the worst possible bug here. `shell: bash`
        # runs `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: terraform plan -no-color -input=false -lock-timeout=120s | tee plan.txt

      - name: Render plan
        if: always()
        run: |
          {
            echo '### Terraform plan';
            echo;
            echo '```terraform';
            # last ~300 lines keeps the comment within GitHub's size limit
            tail -n 300 plan.txt 2>/dev/null || echo "(no plan output — see job logs)";
            echo '```';
          } > comment.md

      # Manual runs have no PR to comment on; the plan lands on the run page.
      - name: Write plan to run summary
        if: always()
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
