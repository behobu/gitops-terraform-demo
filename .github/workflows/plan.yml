name: terraform-plan

# Read-only plan on every PR, posted as a PR comment. No apply.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # post the plan comment
  id-token: write        # OIDC federation to AWS for the S3 backend

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Provider + resource inputs, from repo secrets (never committed).
  TF_VAR_monad_api_token: ${{ secrets.MONAD_API_TOKEN }}
  TF_VAR_monad_organization_id: ${{ secrets.MONAD_ORG_ID }}
  TF_VAR_dedup_hmac_key: ${{ secrets.MONAD_DEDUP_HMAC_KEY }}
  TF_VAR_s3_bucket: ${{ secrets.MONAD_S3_BUCKET }}
  TF_VAR_s3_role_arn: ${{ secrets.MONAD_S3_ROLE_ARN }}
  TF_VAR_s3_ingest_bucket: ${{ secrets.MONAD_S3_INGEST_BUCKET }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (S3 backend)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # Pinned, not `latest`. An unpinned CLI means the plan a reviewer reads and
      # the apply that follows can run on different Terraform versions, and a
      # release lands in CI with no commit to point at. Bump deliberately, and
      # keep it in step with apply.yml. Must satisfy versions.tf (>= 1.11).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform version
        run: terraform version

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=gitops-terraform-demo/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Terraform plan
        id: plan
        # `shell: bash` is load-bearing, not decoration. The default shell is
        # `bash -e {0}`, which does NOT set pipefail, so `terraform plan | tee`
        # exits with tee's status and a FAILING plan reports success. This repo's
        # whole premise is that the plan on a PR is the gate, so a green check
        # that survives a failed plan is the worst possible bug here. `shell: bash`
        # runs `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        run: terraform plan -no-color -input=false -lock-timeout=120s | tee plan.txt

      - name: Post plan as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Terraform plan';
            echo;
            echo '```terraform';
            # last ~300 lines keeps the comment within GitHub's size limit
            tail -n 300 plan.txt 2>/dev/null || echo "(no plan output — see job logs)";
            echo '```';
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
